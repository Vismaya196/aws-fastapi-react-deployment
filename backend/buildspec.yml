version: 0.2

phases:
  install:
    commands:
      - echo "Installing Trivy v0.74.0"
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.74.0
      - trivy --version

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - export REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo "Repository URI=$REPOSITORY_URI"
      - echo "Image tag=$IMAGE_TAG"

  build:
    commands:
      - echo "Building AMD64 Docker image"
      - docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load -t $REPOSITORY_URI:$IMAGE_TAG ./backend
      - echo "Running Trivy security scan"
      - trivy image --scanners vuln --severity CRITICAL,HIGH --exit-code 1 $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Pushing Docker image"
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Tagging image as latest"
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest
      - echo "Pushing latest image"
      - docker push $REPOSITORY_URI:latest
      - printf '[{"name":"fastapi-container","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
